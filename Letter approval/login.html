<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – CampusFlow Portal</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body style="background: #f1f5f9;">

    <!-- Navigation Header -->
    <header class="main-header">
        <div class="container nav-wrapper">
            <a href="index.html" class="brand-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    <polyline points="10 8 14 12 10 16"></polyline>
                </svg>
                CampusFlow
            </a>
            <div class="nav-actions">
                <a href="supabase_config.php" class="btn btn-secondary btn-sm" style="color:#059669; font-weight:700;">⚡ Supabase</a>
                <a href="tables.php" class="btn btn-secondary btn-sm">📊 View DB Tables</a>
                <span style="color: #64748b; font-size: 0.9rem;">Need an account?</span>
                <a href="signup.html" class="btn btn-primary btn-sm">Sign Up</a>
            </div>
        </div>
    </header>

    <!-- Login Container -->
    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Portal Sign In</h1>
                <p>Enter your institutional credentials to access your dashboard.</p>
            </div>

            <div id="loginAlert" class="alert" style="display: none;"></div>

            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label class="form-label">User Identifier *</label>
                    <input type="text" id="loginIdentifier" name="identifier" class="form-control" placeholder="Register No / Faculty ID / Phone / Email" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password *</label>
                    <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Enter password" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Role (Optional / Auto-detected)</label>
                    <select id="loginRole" name="role" class="form-control form-select">
                        <option value="">Auto-Detect Role</option>
                        <option value="student">Student</option>
                        <option value="parent">Parent</option>
                        <option value="advisor">Class Advisor</option>
                        <option value="hod">Head of Department (HOD)</option>
                        <option value="warden">Hostel Warden</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 1.25rem;">
                    Sign In to Dashboard →
                </button>
            </form>

            <!-- Quick Demo Accounts One-Click Tester Tray -->
            <div class="demo-accounts-tray">
                <div class="demo-title">
                    ⚡ Quick Test Demo Accounts (Click to autofill)
                </div>
                <div class="demo-pills">
                    <button type="button" class="demo-pill" onclick="quickFill('21CS101', 'password123', 'student')">
                        🎓 Rahul (Hosteller Student)
                    </button>
                    <button type="button" class="demo-pill" onclick="quickFill('21CS102', 'password123', 'student')">
                        🎓 Priya (Day Scholar Student)
                    </button>
                    <button type="button" class="demo-pill" onclick="quickFill('9876543210', 'password123', 'parent')">
                        👨‍👩‍👧 Suresh (Parent - Tamil)
                    </button>
                    <button type="button" class="demo-pill" onclick="quickFill('FAC-CS-01', 'password123', 'advisor')">
                        📋 Dr. Ramanathan (Advisor)
                    </button>
                    <button type="button" class="demo-pill" onclick="quickFill('HOD-CSE-01', 'password123', 'hod')">
                        🏛️ Dr. Meenakshi (HOD)
                    </button>
                    <button type="button" class="demo-pill" onclick="quickFill('WARDEN-BH-01', 'password123', 'warden')">
                        🏢 Col. Balaji (Warden)
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase_client.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        function quickFill(id, pass, role) {
            document.getElementById('loginIdentifier').value = id;
            document.getElementById('loginPassword').value = pass;
            document.getElementById('loginRole').value = role;
        }
    </script>
</body>
</html>
